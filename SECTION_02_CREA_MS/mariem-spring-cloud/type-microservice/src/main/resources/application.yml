server:
  port: 8080

spring:
  application:
    name: type
  datasource:
    url: 'jdbc:h2:mem:typedb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: '*'
