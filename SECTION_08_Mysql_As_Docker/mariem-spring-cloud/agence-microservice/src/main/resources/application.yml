server:
  port: 8082

spring:
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:http://localhost:9999/"
  application:
    name: agence
  datasource:
    url: jdbc:mysql://mysqldb:3306/agencedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  # h2:
  #   console:
  #     enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

build:
  version: "1.0"
author:
  name: "Mariem Younes"
  email: "mariem@gmail.com"
